apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hasura-cache.fullname" . }}
  labels:
    {{- include "hasura-cache.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hasura-cache.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hasura-cache.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hasura-cache.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APP_CACHE_DISABLED
              value: {{ .Values.app.cacheDisabled | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.endpoint | quote }}
            - name: REDIS_IS_CLUSTER
              value: {{ .Values.redis.cluster | quote }}
            - name: HASURA_ENGINE_HOST
              value: {{ .Values.hasuraEngine.host | quote }}
            - name: HASURA_ENGINE_PORT
              value: {{ .Values.hasuraEngine.port | quote }}
            - name: HASURA_ENGINE_ADMIN_SECRET
              value: {{ .Values.hasuraEngine.adminSecret | quote }}
            - name: RUST_LOG
              value: "app=info"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
