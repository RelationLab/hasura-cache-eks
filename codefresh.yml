# More examples of Codefresh YAML can be found at
# https://codefresh.io/docs/docs/yaml-examples/examples/

version: "1.0"
# Stages can help you organize your steps in stages
stages:
  - "clone"
  - "pulumiOutput"
  - "buildArtifacts"
  - "devDeploy"
  - "prodDeploy"

steps:
  clone:
    title: "Cloning repository"
    type: "git-clone"
    repo: "RelationLab/relation-hasura-cache-eks"
    # CF_BRANCH value is auto set when pipeline is triggered
    # Learn more at codefresh.io/docs/docs/codefresh-yaml/variables/
    revision: "${{CF_BRANCH}}"
    git: "github"
    stage: "clone"

  pulumiUp:
    title: "Pulumi Outputs"
    image: "pulumi/pulumi"
    working_directory: "${{clone}}"
    commands:
      - npm install
      - pulumi login
      - pulumi stack select dev
      - cf_export AWS_ECR_REPO_NAME=$(pulumi stack output ecrRepositoryName)
      - cf_export AWS_ECR_REPO_URL=$(pulumi stack output ecrRepositoryUrl)
      - cf_export HASURA_ENGINE_SECRET_ID_DEV=$(pulumi stack output hasuraEngineSecretId)
      - cf_export AWS_REDIS_CLUSTER_ENDPOINT_DEV=$(pulumi stack output redisClusterEndpoint)
      - pulumi stack select prod
      - cf_export HASURA_ENGINE_SECRET_ID_PROD=$(pulumi stack output hasuraEngineSecretId)
      - cf_export AWS_REDIS_CLUSTER_ENDPOINT_PROD=$(pulumi stack output redisClusterEndpoint)

  buildArtifacts:
    type: parallel
    stage: "buildArtifacts"
    steps:
      buildImage:
        title: "Building Docker image"
        type: "build"
        image_name: "${{AWS_ECR_REPO_NAME}}"
        working_directory: "${{clone}}/app"
        dockerfile: "Dockerfile"
        tag: '${{CF_BRANCH_TAG_NORMALIZED}}-${{CF_SHORT_REVISION}}'
      fetchSecrets:
        title: "Fetch AWS Secrets"
        type: aws-secrets-manager
        arguments:
          AWS_DEFAULT_REGION: "${{AWS_DEFAULT_REGION}}"
          secrets:
            - secret_arn: "${{HASURA_ENGINE_SECRET_ID_DEV}}"
              key: "hasuraAdminSecret"
              store_in: HASURA_ENGINE_ADMIN_SECRET_DEV
            - secret_arn: "${{HASURA_ENGINE_SECRET_ID_PROD}}"
              key: "hasuraAdminSecret"
              store_in: HASURA_ENGINE_ADMIN_SECRET_PROD

  devDeploy:
    title: "Deploy helm to AWS EKS dev env"
    type: helm
    working_directory: "${{clone}}"
    arguments:
      chart_name: helm
      release_name: hasura-cache
      helm_version: 3.6.1
      namespace: dev
      kube_context: wired-eks-prod
      custom_values:
        - "image_repository=${{AWS_ECR_REPO_URL}}"
        - "image_tag=${{CF_BRANCH_TAG_NORMALIZED}}-${{CF_SHORT_REVISION}}"
        - "hasuraEngine_adminSecret=${{HASURA_ENGINE_ADMIN_SECRET_DEV}}"
        - "redisCluster_endpoint=${{AWS_REDIS_CLUSTER_ENDPOINT_DEV}}"
        
  askForPermission:
    type: pending-approval
    stage: prodDeploy
    title: Deploy to production?
        
  prodDeploy:
    title: "Deploy helm to AWS EKS prod env"
    stage: prodDeploy
    type: helm
    working_directory: "${{clone}}"
    arguments:
      chart_name: helm
      release_name: hasura-cache
      helm_version: 3.6.1
      namespace: prod
      kube_context: wired-eks-prod
      custom_values:
        - "image_repository=${{AWS_ECR_REPO_URL}}"
        - "image_tag=${{CF_BRANCH_TAG_NORMALIZED}}-${{CF_SHORT_REVISION}}"
        - "hasuraEngine_adminSecret=${{HASURA_ENGINE_ADMIN_SECRET_PROD}}"
        - "redisCluster_endpoint=${{AWS_REDIS_CLUSTER_ENDPOINT_PROD}}"